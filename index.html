<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>🍔 نظام إدارة ومبيعات مطعم عاصم 🍟</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #fff9f1; color: #333; }
        .restaurant-container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #e44d26; text-align: center; font-size: 28px; margin-bottom: 5px; }
        h2 { color: #f7931e; border-bottom: 2px solid #f7931e; padding-bottom: 5px; margin-top: 30px; text-align: right; }
        select { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; background: white; }
        .btn-order { background-color: #e44d26; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; text-decoration: none; display: block; text-align: center; }
        .btn-order:hover { background-color: #cd3c1a; }
        .invoice-box { background-color: #fff3e0; color: #d35400; padding: 15px; border-radius: 6px; font-size: 18px; font-weight: bold; margin: 20px 0; border: 1px solid #ffe0b2; }
        .orders-list { background: #fffdf9; padding: 15px; border-radius: 8px; border-right: 5px solid #f7931e; text-align: right; margin-top: 20px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 8px 0; border-bottom: 1px solid #eee; font-size: 15px; }
        .price { font-weight: bold; color: #28a745; }
    </style>
</head>
<body>

    <div class="restaurant-container">
        <h1>🍔 نظام مبيعات مطعم عاصم 🍟</h1>
        <p style="text-align: center; color: #777;">أهلاً بك في منيو الأكلات السريع للمطور عاصم</p>

        <h2>📋 اختار وجبتك المفضلة اليوم:</h2>
        <select>
            <option>🍔 برجر عاصم العملاق (140 جنيه)</option>
            <option>🍕 بيتزا إيطالي مشكل جبن (160 جنيه)</option>
            <option>🍟 بطاطس مقرمشة بالجبنة (50 جنيه)</option>
            <option>🥤 عصير فريش ليمون نعناع (35 جنيه)</option>
        </select>
        
        <a href="#" class="btn-order" onclick="alert('تم تسجيل طلبك وحفظ الوجبة في قاعدة بيانات مطعم عاصم! 🎉🍔')">🛒 اطلب الوجبة الآن</a>

        <div class="invoice-box">
            💰 الفاتورة الإجمالية للطلبات: <span class="price">140 ج.م</span>
        </div>

        <div class="orders-list">
            <h3>📊 الطلبات المسترجعة من قاعدة بيانات بايثون:</h3>
            <ul>
                <li>• تم حفظ 🍔 <b>برجر عاصم العملاق</b> بسعر (140 ج.م) داخل الـ Database بسلام.</li>
            </ul>
        </div>
    </div>

</body>
</html>
